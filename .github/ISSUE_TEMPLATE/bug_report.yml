name: "Report a Bug"
description: >
  Something in MegaMek is broken or behaving incorrectly. Please check that you are on the
  right repository and that nobody has reported this already.
type: "Bug"
labels:
  - Bug

body:
  - type: markdown
    attributes:
      value: |
        The quickest way to file this is the **Report a Bug** button in MegaMek - on the Help menu, on
        the Commands button above the board, or beside the Done button. It saves your game, gathers the
        logs into a single ZIP, and fills in the version fields below for you.

        If your version does not have that button yet, attach your save and the contents of the `logs`
        folder by hand.

  - type: textarea
    id: brief-description
    attributes:
      label: "What went wrong"
      description: |
        Describe what you saw. Screenshots help.

        If it is a rules problem, name the rulebook and its edition, give the page number, and quote the
        relevant text. For more detail, see
        [our wiki](https://github.com/MegaMek/megamek/wiki/Creating-an-Issue-(Bug-Report%2C-Request-for-Enhancement%2C-Errata)).
      placeholder: "Describe the problem here..."
    validations:
      required: true

  - type: textarea
    id: expected-behaviour
    attributes:
      label: "What you expected instead"
      description: "One line is enough. This is what separates a bug from a rule working as written."
      placeholder: "I expected..."
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: "Steps to reproduce"
      description: >
        A numbered list, if you can make it happen again. If it happened once and never came back,
        say so - that is still worth reporting.
      placeholder: "1. ...\n2. ...\n3. ..."

  - type: upload
    id: report-files
    attributes:
      label: "Attach your files"
      description: >
        The ZIP from the Report a Bug button, or your save game and the files from the logs folder.
        Archives up to 25 MB, video up to 100 MB.
    validations:
      required: false
      accept: ".zip,.gz,.log,.txt,.csv,.png,.jpg,.jpeg,.gif,.mp4,.mov"

  - type: textarea
    id: log-excerpt
    attributes:
      label: "Relevant log lines"
      description: "Only needed if you cannot attach the files. Paste the stack trace, or the lines around the problem."
      render: text

  - type: input
    id: custom-megamek-version
    attributes:
      label: "MegaMek Suite Version"
      description: >
        Filled in for you if you opened this form from the program. By hand: open logs/megamek.log in a
        text editor and read the header.
      placeholder: "Example: 0.51.0"
    validations:
      required: true

  - type: input
    id: operating-system
    attributes:
      label: "Operating System"
      description: "Please be specific - Windows 11, macOS 15 Sequoia, Ubuntu 24.04."
      placeholder: "Example: Windows 11 (10.0.26200) amd64"
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: "Java Version"
      description: "From the same log header."
      placeholder: "Example: Eclipse Adoptium 21.0.8+9"
    validations:
      required: true

  - type: checkboxes
    id: final-checks
    attributes:
      label: "Before you submit"
      options:
        - label: "This report only contains one issue or request, and I haven't already reported it"
          required: true
        - label: >
            I am on the right repository - MegaMek for battles, MegaMekLab for unit design, MekHQ for
            campaigns, mm-data for unit and planet data
          required: true
        - label: "I have asked about this on the MegaMek Discord (optional)"
