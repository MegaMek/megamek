name: Backport Merged Pull Requests

# A small bug fix goes to main and to the current release branch. Instead of opening the second pull
# request by hand, put the "Backport" label on the main pull request. When it merges, this workflow
# cherry-picks the merged commit onto the current release branch and opens the patch pull request,
# titled with "(PATCH)" after the colon:
#
#     Fix #9720: Toxic air breaches the cockpit        (the main pull request)
#     Fix #9720: (PATCH) Toxic air breaches the cockpit (the one this workflow opens)
#
# The current release branch is the newest "releases/<version>" branch in the repository, so nothing
# here changes when a new release branch is cut. To pin a different branch, set the BACKPORT_BRANCH
# Actions variable (repository or organization level); it wins over the newest branch.
#
# To send a fix to some other branch, use a "backport <branch>" label instead, for example
# "backport releases/0.50.10". Both kinds of label can be on one pull request.
#
# The label also works when added after the merge. If the cherry-pick conflicts, no pull request is
# opened: the workflow comments on the main pull request instead, and the backport is done by hand.
#
# With a GitHub App configured, the rest is automatic too. The fix was already reviewed on main, so
# the patch pull request gets no second review: its CI starts by itself, and the workflow merges it
# once every CI run on it has passed. The build is the one check that is not a repeat, because the
# release branch holds older code than main. If the build fails, the patch pull request stays open
# and a comment on it says why.
#
# The App is set with the BACKPORT_APP_ID variable and the BACKPORT_APP_PRIVATE_KEY secret
# (repository or organization level). It needs write access to contents and pull requests.
#
# Without the App, the patch pull request is opened with GITHUB_TOKEN. GitHub does not start CI on
# it then, and nothing is merged automatically: close and reopen it to run CI, then merge it by hand.
#
# pull_request_target gives the token write access when the main pull request came from a fork. The
# workflow only cherry-picks the merged commit; it never builds or runs the pull request's code.
on:
  pull_request_target:
    types: [ closed, labeled ]

permissions:
  # Push the backport branch and comment on the main pull request.
  contents: write
  # Open the patch pull request and copy the labels onto it.
  pull-requests: write

jobs:
  backport:
    # Merged pull requests only: on the merge itself when a backport label is already there, or when a
    # backport label is added to a pull request that has already merged. Only pull requests into the
    # default branch count, so a patch pull request can never start a backport of its own.
    if: >
      github.event.pull_request.merged &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      (
        (github.event.action == 'closed' &&
          (contains(github.event.pull_request.labels.*.name, 'Backport') ||
            contains(toJSON(github.event.pull_request.labels.*.name), '"backport '))) ||
        (github.event.action == 'labeled' &&
          (github.event.label.name == 'Backport' || startsWith(github.event.label.name, 'backport ')))
      )
    runs-on: ubuntu-latest
    # Long enough to wait for the patch pull request's build before merging it.
    timeout-minutes: 120

    steps:
      # Secrets cannot be read in an "if", so this step turns "is the App set up?" into an output.
      - name: Check for the backport App
        id: app_config
        env:
          APP_ID: ${{ vars.BACKPORT_APP_ID }}
          APP_KEY_PRESENT: ${{ secrets.BACKPORT_APP_PRIVATE_KEY != '' }}
        run: |
          if [[ -n "$APP_ID" && "$APP_KEY_PRESENT" == "true" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No backport App is configured. The patch pull request will need a close and reopen to start CI, and a merge by hand."
          fi

      # A pull request opened with the App's token starts CI like one a person opened. The token only
      # reaches this repository. If it cannot be made, the workflow carries on with GITHUB_TOKEN.
      - name: Get a token for the backport App
        id: app
        if: steps.app_config.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BACKPORT_APP_ID }}
          private-key: ${{ secrets.BACKPORT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      # The title only reaches the shell through an environment variable.
      - name: Build the (PATCH) title
        id: title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$TITLE" == *": "* ]]; then
            patch_title="${TITLE%%: *}: (PATCH) ${TITLE#*: }"
          else
            patch_title="(PATCH) ${TITLE}"
          fi
          # The action reads "${name}" as a placeholder, so drop the dollar sign from any in the title.
          patch_title="${patch_title//\$\{/\{}"
          echo "patch_title=${patch_title}" >> "$GITHUB_OUTPUT"

      # The branch the "Backport" label sends a fix to: the BACKPORT_BRANCH variable when it is set,
      # otherwise the newest releases/<version> branch, compared as version numbers.
      - name: Find the current release branch
        id: release
        env:
          PINNED_BRANCH: ${{ vars.BACKPORT_BRANCH }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [[ -n "$PINNED_BRANCH" ]]; then
            branch="$PINNED_BRANCH"
          else
            branch="$(git ls-remote --heads "$REPOSITORY_URL" 'releases/*' | sed 's#.*refs/heads/##' | sort -V | tail -n 1)"
          fi
          if [[ -z "$branch" ]]; then
            echo "::warning::No releases/* branch found, so the Backport label has nowhere to send this fix."
          fi
          echo "Current release branch: ${branch:-none}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # The backport branch is pushed with this token.
          token: ${{ steps.app.outputs.token || github.token }}

      - name: Open the patch pull request
        id: backport
        uses: korthout/backport-action@v5
        with:
          github_token: ${{ steps.app.outputs.token || github.token }}
          pull_title: ${{ steps.title.outputs.patch_title }}
          # The "Backport" label means the current release branch. A "backport <branch>" label names
          # its own branch, and the action reads those by itself.
          target_branches: ${{ contains(github.event.pull_request.labels.*.name, 'Backport') && steps.release.outputs.branch || '' }}
          # The note at the top says plainly that no person opened this pull request.
          pull_description: |-
            > [!NOTE]
            > **Opened automatically** by the Backport Merged Pull Requests workflow, because #${pull_number} merged with a backport label for `${target_branch}`. Nobody has built or tested this branch yet.
            >
            > ${{ steps.app.outputs.token && 'It merges by itself once its build passes. If the build fails, it stays open and a comment says why.' || 'CI does not start on its own. Close and reopen this pull request to run it, then merge it by hand.' }}

            Backport of #${pull_number} to `${target_branch}`.

            ${pull_description}
          # The same labels as the main pull request, apart from the backport labels.
          copy_labels_pattern: '^(?!Backport$).*'
          # Marks the pull request as opened by this workflow, in pull request lists as well as on the page.
          add_labels: Automated Backport
          # The author of the fix owns the backport, and any conflict in it.
          add_author_as_assignee: true

      # The fix was reviewed on main, so the patch pull request needs no second review. It does need
      # its own build, because the release branch holds older code. Wait for every CI run on the
      # patch commit, then merge only if all of them passed.
      - name: Merge the patch pull request once its build passes
        if: steps.app.outputs.token != '' && steps.backport.outputs.created_pull_numbers != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PATCH_PULL_NUMBERS: ${{ steps.backport.outputs.created_pull_numbers }}
          # Time for GitHub to start the CI runs before the first look at them.
          SETTLE_SECONDS: 120
          POLL_SECONDS: 60
          WAIT_MINUTES: 90
        run: |
          not_merged=0
          for number in $PATCH_PULL_NUMBERS; do
            head_sha="$(gh pr view "$number" --json headRefOid --jq .headRefOid)"
            echo "Patch pull request #${number} at ${head_sha}: waiting for its build."
            sleep "$SETTLE_SECONDS"

            deadline=$(( $(date +%s) + WAIT_MINUTES * 60 ))
            result="did not finish within ${WAIT_MINUTES} minutes"
            while (( $(date +%s) < deadline )); do
              # One line for each CI workflow on the patch commit: "<status> <conclusion> <name>".
              # Only the newest run of a workflow counts, so a re-run replaces the run before it.
              runs="$(gh run list --commit "$head_sha" --event pull_request --limit 50 \
                --json status,conclusion,name,createdAt \
                --jq 'group_by(.name) | map(max_by(.createdAt)) | .[] | "\(.status) \(.conclusion) \(.name)"' || true)"
              if [[ -z "$runs" ]] || grep -q -v '^completed ' <<< "$runs"; then
                sleep "$POLL_SECONDS"
                continue
              fi
              failed_runs="$(grep -v -E '^completed (success|skipped|neutral) ' <<< "$runs" \
                | sed -E 's/^completed [a-z_]* //' | paste -sd ',' - || true)"
              if [[ -n "$failed_runs" ]]; then
                result="failed (${failed_runs})"
              else
                result="passed"
              fi
              break
            done

            if [[ "$result" == "passed" ]]; then
              # Refused if anyone pushed to the branch after the build that was checked.
              if gh pr merge "$number" --merge --delete-branch --match-head-commit "$head_sha"; then
                echo "Merged patch pull request #${number}."
                continue
              fi
              result="passed, but the merge was refused"
            fi

            echo "::error::Patch pull request #${number} was not merged: its build ${result}."
            gh pr comment "$number" --body "Not merged automatically: the build ${result}. This pull request stays open. Fix the branch and merge it by hand, or close it." || true
            not_merged=1
          done
          exit "$not_merged"
