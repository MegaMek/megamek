name: Checkstyle

on:
  pull_request:
    branches: [ main ]

jobs:
  checkstyle:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ ubuntu-latest ]
        java-distribution: [ temurin ]
        java-version: [ 25 ]
      fail-fast: false

    steps:
      - name: Checkout Data Repo
        uses: actions/checkout@v7
        with:
          repository: megamek/mm-data
          path: mm-data

      - name: "Check out MegaMek"
        uses: actions/checkout@v7
        with:
          path: megamek

      - name: Set up ${{ matrix.java-distribution }} JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.java-distribution }}
          java-version: ${{ matrix.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      # Formatting first: it finishes in about a minute and reports every violation in one run.
      # The ratchet in build.gradle compares against origin/main, which a shallow checkout does not have.
      - name: Fetch main for the formatting ratchet
        working-directory: megamek
        run: git fetch --depth=1 origin main

      - name: Formatting (Spotless)
        working-directory: megamek
        run: |
          ./gradlew spotlessApply
          if git diff --quiet; then
            echo "Formatting clean."
            exit 0
          fi
          {
            echo "## Formatting violations"
            echo
            echo "Run \`./gradlew spotlessApply\` and commit the result. Every file below is fixed by that one command."
            echo
            echo '```diff'
            git diff | head -c 900000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git diff --name-only | while read -r changedFile; do
            echo "::error file=${changedFile}::Formatting violation. Run ./gradlew spotlessApply"
          done
          exit 1

      - name: Checkstyle
        working-directory: megamek
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Upload Test Logs on Failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cd-failure-logs
          path: megamek/megamek/build/reports/
