name: MegaMek CI with Gradle

on:
  pull_request:
    branches: [ main ]

env:
  GRADLE_OPTS: "-Dscan.link.VCS=${{ github.event.pull_request.html_url }}"
  mm.profile: "dev"

jobs:
  pr_build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ ubuntu-latest ]
        java-distribution: [ temurin ]
        java-version: [ 21, 25 ]
      fail-fast: false

    steps:
      - name: Find the Right Data Branch
        id: find_data
        shell: bash {0}
        env:
          DATA_REPO_URL: ${{ github.event.pull_request.head.repo.owner.html_url }}/mm-data.git
          DATA_REPO: ${{ github.event.pull_request.head.repo.owner.login }}/mm-data
          DATA_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set +e
          git ls-remote --exit-code --heads "$DATA_REPO_URL" "refs/heads/$DATA_BRANCH" > /dev/null
          status=$?
          set -e

          case "$status" in
            0)
              echo "dataRepo=$DATA_REPO" >> "$GITHUB_OUTPUT"
              echo "dataBranch=$DATA_BRANCH" >> "$GITHUB_OUTPUT"
              ;;
            2)
              echo "Matching mm-data branch not found; using MegaMek/mm-data main."
              echo "dataRepo=MegaMek/mm-data" >> "$GITHUB_OUTPUT"
              echo "dataBranch=main" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unable to query $DATA_REPO_URL (git ls-remote exited $status)." >&2
              exit "$status"
              ;;
          esac

      - name: Checkout Data Repo
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.find_data.outputs.dataRepo }}
          ref: ${{ steps.find_data.outputs.dataBranch }}
          path: mm-data

      - name: "Check out MegaMek"
        uses: actions/checkout@v7
        with:
          path: megamek

      - name: Set short git commit SHA
        id: vars
        run: |
          cd megamek
          calculatedSha=$(git rev-parse --short ${{ github.sha }})
          echo "COMMIT_SHORT_SHA=$calculatedSha" >> $GITHUB_ENV

      - name: "Output branch information to Version file"
        run: |
          echo "branch=PR-${{ github.event.number }}" >> megamek/megamek/resources/extraVersion.properties
          echo "gitHash=${{ env.COMMIT_SHORT_SHA }}" >> megamek/megamek/resources/extraVersion.properties

      - name: Set up ${{ matrix.java-distribution }} JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.java-distribution }}
          java-version: ${{ matrix.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test
        working-directory: megamek
        run: ./gradlew test -x checkstyleMain -x checkstyleTest

      - name: Upload Test Logs on Failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cd-failure-logs
          path: ./megamek/megamek/build/reports/

      - name: CodeCov.io Coverage Report
        uses: codecov/codecov-action@v7
        with:
          directory: ./megamek/megamek/build/reports/jacoco/test
          fail_ci_if_error: false
          verbose: true

      - name: Build with Gradle
        working-directory: megamek
        run: ./gradlew build -x test -x checkstyleMain -x checkstyleTest -PextraVersion="PR-${{ github.event.number}}-${{ env.COMMIT_SHORT_SHA }}"

      - name: Upload TarGZ Release
        uses: actions/upload-artifact@v7
        with:
          name: mm-release-tar-gz-${{ matrix.java-distribution }}-jdk${{ matrix.java-version }}
          path: ./megamek/megamek/build/distributions/*.tar.gz
