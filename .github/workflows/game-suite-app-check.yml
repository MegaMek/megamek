name: Game suite App access check (manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment whose App key to check
        required: true
        type: choice
        options: [suite-release-live, suite-release-weekly]
        default: suite-release-live

permissions:
  contents: read

concurrency:
  group: game-suite-release-global
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.environment }}
    steps:
      - name: Check App configuration
        env:
          APP_ID: ${{ vars.SUITE_RELEASE_APP_ID }}
          APP_KEY_PRESENT: ${{ secrets.SUITE_RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [[ -z "$APP_ID" || "$APP_KEY_PRESENT" != "true" ]]; then
            echo "::error::Missing suite release App configuration"
            exit 1
          fi
      - name: Mint the release-scoped App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.SUITE_RELEASE_APP_ID }}
          private-key: ${{ secrets.SUITE_RELEASE_APP_PRIVATE_KEY }}
          owner: MegaMek
          repositories: megamek,megameklab,mekhq,mm-data
          permission-contents: write
      - name: Verify repository scope and read access
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          repositories=$(gh api --method GET 'installation/repositories?per_page=100' \
            --jq '[.repositories[].full_name] | sort | join(",")')
          if [[ "$repositories" != "MegaMek/megamek,MegaMek/megameklab,MegaMek/mekhq,MegaMek/mm-data" ]]; then
            echo "::error::App token repository scope does not match the four suite repositories (is the App installed on mm-data?)"
            exit 1
          fi
          for repo in megamek megameklab mekhq mm-data; do
            gh api --method GET "repos/MegaMek/$repo/git/ref/heads/main" --silent
          done
          echo "App authentication and repository access verified. No releases were published."
          echo "Verified release App credentials and access to all four suite repositories. No repository writes or game builds were performed." >> "$GITHUB_STEP_SUMMARY"
