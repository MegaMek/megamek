name: Game suite release

on:
  # Weekly every Tuesday 06:00 UTC (Monday night in the Americas); always membership weekly, live.
  schedule:
    - cron: "0 6 * * 2"
  # Manual runs: Milestone, Development, or a corrective Weekly. Live manual runs need reviewer approval.
  workflow_dispatch:
    inputs:
      membership:
        description: Release membership
        required: true
        type: choice
        options: [weekly, milestone, development]
        default: weekly
      dry_run:
        description: Build and verify without publication
        type: boolean
        required: true
        default: true
      bootstrap:
        description: First complete record only (no prior suite record exists)
        type: boolean
        required: true
        default: false
      version:
        description: Development/Milestone version, e.g. 0.51.01 (leave empty for Weekly, which is allocated)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: game-suite-release-global
  cancel-in-progress: false

jobs:
  suite:
    # Forks never run the schedule; SUITE_RELEASES_ENABLED != true pauses it without failing.
    if: ${{ github.event_name != 'schedule' || (github.repository == 'MegaMek/megamek' && vars.SUITE_RELEASES_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Scheduled Weekly publishes unattended; every manual live run waits for a reviewer.
    environment: ${{ github.event_name == 'schedule' && 'suite-release-weekly' || (inputs.dry_run && 'suite-release-dry-run' || 'suite-release-live') }}
    env:
      MEMBERSHIP: ${{ github.event_name == 'schedule' && 'weekly' || inputs.membership }}
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
      BOOTSTRAP: ${{ github.event_name == 'schedule' && 'false' || inputs.bootstrap }}
    steps:
      - name: Gate live operation before checkout
        env:
          ENABLED: ${{ vars.SUITE_RELEASES_ENABLED }}
          APP_ID: ${{ vars.SUITE_RELEASE_APP_ID }}
          APP_KEY_PRESENT: ${{ secrets.SUITE_RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [[ "$DRY_RUN" != "true" && "$ENABLED" != "true" ]]; then
            echo "::error::Live suite releases disabled (SUITE_RELEASES_ENABLED must be true)"
            exit 1
          fi
          if [[ "$DRY_RUN" != "true" && ( -z "$APP_ID" || "$APP_KEY_PRESENT" != "true" ) ]]; then
            echo "::error::Missing suite release App configuration"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify tooling and clone four official sources with full history
        run: |
          gh --version
          git --version
          mkdir sources
          for repo in megamek megameklab mekhq mm-data; do
            git clone "https://github.com/MegaMek/$repo.git" "sources/$repo"
          done
      - name: Read-only preflight, retain prior bytes, and build frozen sources
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          # Pinned worktrees and builds exceed the ~7.8 GB RAM-backed /tmp on Ubuntu 26.04+.
          TMPDIR: ${{ runner.temp }}
          VERSION: ${{ github.event_name != 'schedule' && inputs.version || '' }}
        run: |
          args=(--membership "$MEMBERSHIP" --sources sources --state suite-state)
          if [[ "$BOOTSTRAP" == "true" ]]; then args+=(--bootstrap); fi
          if [[ -n "$VERSION" ]]; then args+=(--version "$VERSION"); fi
          python3 scripts/suite_release_coordinator.py prepare "${args[@]}"
          echo "noop=$(python3 -c 'import json; d=json.load(open("suite-state/inventory.json")); from sys import path; path.insert(0,"scripts"); from suite_release_plan import plan; print("true" if plan(d)["weeklyNoopCandidate"] else "false")')" >> "$GITHUB_OUTPUT"
      - name: Complete dry-run or verified Weekly no-op without write token
        if: ${{ env.DRY_RUN == 'true' || steps.prepare.outputs.noop == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TMPDIR: ${{ runner.temp }}
        run: |
          args=(--sources sources --state suite-state)
          if [[ "$BOOTSTRAP" == "true" ]]; then args+=(--bootstrap); fi
          if [[ "$DRY_RUN" != "true" ]]; then args+=(--publish); fi
          python3 scripts/suite_release_coordinator.py finish "${args[@]}"
      - name: Mint narrowly scoped App token after successful builds
        if: ${{ env.DRY_RUN != 'true' && steps.prepare.outputs.noop == 'false' }}
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.SUITE_RELEASE_APP_ID }}
          private-key: ${{ secrets.SUITE_RELEASE_APP_PRIVATE_KEY }}
          owner: MegaMek
          repositories: megamek,megameklab,mekhq
          permission-contents: write
      - name: Recheck remote inventory and publish once, record last
        if: ${{ env.DRY_RUN != 'true' && steps.prepare.outputs.noop == 'false' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TMPDIR: ${{ runner.temp }}
        run: |
          args=(--sources sources --state suite-state --publish)
          if [[ "$BOOTSTRAP" == "true" ]]; then args+=(--bootstrap); fi
          python3 scripts/suite_release_coordinator.py finish "${args[@]}"
      # The release is complete at this point. The steps below only record its version in the tracked
      # Version.properties on main; prepare treats a version-only MegaMek change as unchanged, so this
      # commit never makes the next Weekly a release on its own.
      - name: Rewrite Version.properties on current main to the published version
        if: ${{ env.DRY_RUN != 'true' && steps.prepare.outputs.noop == 'false' }}
        id: bump
        working-directory: sources/megamek
        run: |
          version="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["versionCandidate"])' \
            ../../suite-state/build_result.json)"
          git fetch --quiet origin main
          git switch --quiet --detach FETCH_HEAD
          ./gradlew --no-daemon :megamek:setVersionProperties -PnewVersion="$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- megamek/resources/Version.properties; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version.properties on megamek main already reads $version." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Mint megamek-only App token for the version commit
        if: ${{ steps.bump.outputs.changed == 'true' }}
        id: bump-app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.SUITE_RELEASE_APP_ID }}
          private-key: ${{ secrets.SUITE_RELEASE_APP_PRIVATE_KEY }}
          owner: MegaMek
          repositories: megamek
          permission-contents: write
      - name: Commit and push the version to megamek main
        if: ${{ steps.bump.outputs.changed == 'true' }}
        working-directory: sources/megamek
        env:
          TOKEN: ${{ steps.bump-app.outputs.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          GIT_AUTHOR_NAME: ${{ steps.bump-app.outputs.app-slug }}[bot]
          GIT_AUTHOR_EMAIL: ${{ steps.bump-app.outputs.app-slug }}[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ steps.bump-app.outputs.app-slug }}[bot]
          GIT_COMMITTER_EMAIL: ${{ steps.bump-app.outputs.app-slug }}[bot]@users.noreply.github.com
        run: |
          git commit --quiet -m "Set Version.properties to $VERSION after the suite release [skip ci]" \
            -- megamek/resources/Version.properties
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          # main may move while this runs; replay the one-file commit onto it, a few times at most.
          for attempt in 1 2 3; do
            if git -c "http.https://github.com/.extraheader=$auth" push --quiet origin HEAD:refs/heads/main; then
              echo "Version.properties on megamek main set to $VERSION ($(git rev-parse --short HEAD))." \
                >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git fetch --quiet origin main
            git rebase --quiet FETCH_HEAD
          done
          echo "::error::Could not push the Version.properties commit to megamek main"
          exit 1
      - name: Keep the plan and seal for diagnosis
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: suite-state-${{ env.MEMBERSHIP }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: suite-state/*.json
          if-no-files-found: ignore
          retention-days: 30

  report-scheduled-failure:
    needs: suite
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the Weekly failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled Weekly suite release failed"
          body="Scheduled Weekly suite release failed: $RUN_URL"$'\n\n'"Check the job summary and the suite-state artifact. See docs/game-suite-release-operations.md before re-running; a failure after a tag or release write needs manual reconciliation. A failure in the Version.properties commit steps leaves a complete release; only that commit is missing."
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
