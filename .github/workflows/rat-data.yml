name: RAT Explorer Data

# Builds the data for the RAT Probability Explorer on the MegaMek website, and checks that the website's copy of the
# RAT Generator (megamek/web/ratgen/ratgen.js) still gives the same tables as MegaMek.
#
# - Pull requests that touch the RAT Generator, the exporter or the website engine: parity check only, so a Java change
#   that the JavaScript copy has not followed fails here.
# - Pushes to main, the nightly run (which picks up mm-data changes) and manual runs: parity check, then the data
#   build, kept as the "rat-data" workflow artifact (inputs.json.gz and ratgen.js).
# - The website (megamek.github.io, "Update RAT Explorer data") fetches the newest artifact from main every night and
#   commits it when the data changed. Nothing is published as a release, so the data never sits among the
#   Experimental builds.

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'megamek/src/megamek/client/ratgenerator/**'
      - 'megamek/src/megamek/utilities/ratdata/**'
      - 'megamek/web/ratgen/**'
      - 'megamek/build.gradle'
      - '.github/workflows/rat-data.yml'
  push:
    branches: [ main ]
    paths:
      - 'megamek/src/megamek/client/ratgenerator/**'
      - 'megamek/src/megamek/utilities/ratdata/**'
      - 'megamek/web/ratgen/**'
      - 'megamek/build.gradle'
      - '.github/workflows/rat-data.yml'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rat_data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Data Repo
        uses: actions/checkout@v7
        with:
          repository: MegaMek/mm-data
          ref: main
          path: mm-data

      - name: Check out MegaMek
        uses: actions/checkout@v7
        with:
          path: megamek

      - name: Set up temurin JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Record build ids
        run: |
          echo "MEGAMEK_SHA=$(git -C megamek rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "MM_DATA_SHA=$(git -C mm-data rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # A new seed every run, so over time the check covers far more than any one run's tables
      - name: Parity check (website engine vs MegaMek)
        working-directory: megamek
        run: ./gradlew :megamek:stageDataFiles :megamek:ratParity -PratParityCount=3000 -PratParitySeed=${{ github.run_number }}

      - name: Build the website data
        if: github.event_name != 'pull_request'
        working-directory: megamek
        run: |
          ./gradlew :megamek:ratData -PratDataOut="$GITHUB_WORKSPACE/rat-data" \
            -PratDataBuildId="megamek ${MEGAMEK_SHA}, mm-data ${MM_DATA_SHA}"
          cp megamek/web/ratgen/ratgen.js "$GITHUB_WORKSPACE/rat-data/"

      - name: Upload the website data
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: rat-data
          path: rat-data/
          retention-days: 30

      - name: Upload parity files on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rat-parity
          path: megamek/megamek/build/ratparity/
