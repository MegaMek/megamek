name: Networking tests

# Fork-specific fast feedback: runs only the networking test packages on every push and pull request.
# The full upstream suite still runs through ci.yml on pull requests to main.

on:
  push:
    branches-ignore: [ 'upstream' ]
  pull_request:
  workflow_dispatch:

env:
  mm.profile: "dev"

jobs:
  networking_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out mm-data
        uses: actions/checkout@v7
        with:
          repository: MegaMek/mm-data
          ref: main
          path: mm-data

      - name: Check out MegaMek
        uses: actions/checkout@v7
        with:
          path: megamek

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run networking tests
        working-directory: megamek
        run: >
          ./gradlew :megamek:test
          -x checkstyleMain -x checkstyleTest
          --tests 'megamek.common.net.*'
          --tests 'megamek.server.net.*'
          --tests 'megamek.server.ServerPacketHandlingTest'

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: networking-test-reports
          path: ./megamek/megamek/build/reports/tests/
