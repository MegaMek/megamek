# Was the last release confirmed as a Milestone?
# Please update mmconf/milestoneReleases.yml
major=0
minor=51
patch=01
#
# Optional fourth component, for a special point release that ships on top of an existing patch release
# (for example 0.49.19.1). Ordinary releases do NOT have one: leave the line below commented out, and
# comment it out again straight after the point release is tagged.
#
# Note that MekHQ and MegaMekLab read THIS file to version their own builds, so setting a revision here
# versions the whole suite. Only set it on the release branch the point release is cut from.
#
#revision=1
#
# Optional note about this build, shown on the main menu directly under the version number.
#
# Leave the line below commented out for an ordinary release: the main menu then looks exactly as it
# always has. Set it to say something about a particular build - for example that it is a development
# build, or that it is a hotfix for a specific problem - and that text appears under the version.
#
# Keep it to a short sentence or two: the text wraps to the width of the menu buttons, so a long note
# pushes the buttons down the screen. Use plain ASCII only.
#
notes=Core Rules Release
#
# Colour of the note. One of: red, orange, yellow, green, blue, cyan, magenta, pink, white, black,
# gray, lightgray, darkgray (grey is accepted as well). Leave it out and the note uses the same
# warning colour the rest of MegaMek uses for things the player should notice. An unrecognised name
# falls back to that warning colour and is reported in megamek.log.
#
notesColor=Red
#
# Point size of the note, between 6 and 72. Leave it out and the note is drawn at the same size as
# the rest of the menu. A size outside that range falls back to the menu size and is reported in
# megamek.log. Remember that a large size makes the note taller and pushes the buttons down.
#
notesFontSize=14
#
# Optional tag sprayed straight across the MegaMek logo on the splash artwork, in red spray-paint
# lettering. This is separate from the note above, so the artwork and the menu can say different
# things - or a build can have one without the other.
#
# Leave it out and the artwork is left clean. Keep it SHORT: it is sized to sit across the width of
# the logo, so a long tag comes out small and cramped. Use plain ASCII only.
#
# The lettering needs the "Rubik Spray Paint" font, which ships in mm-data under
# data/fonts/Rubik_Spray_Paint. If that font is missing the tag is still drawn, in the default font,
# and a warning goes to megamek.log.
#
splashTag=Core Rules Edition
#
# Colour of the sprayed tag, from the same list of names as notesColor above: red, orange, yellow,
# green, blue, cyan, magenta, pink, white, black, gray, lightgray, darkgray (grey is accepted too).
# Leave it out and the tag is sprayed in red. An unrecognised name falls back to red and is reported
# in megamek.log. Whichever colour is chosen is left slightly see-through, so the logo shows through
# the paint.
#
#splashTagColor=red
#
# Angle the tag is sprayed at, in degrees. Zero is level. A NEGATIVE angle drops the left-hand end and
# lifts the right-hand end; a POSITIVE angle does the opposite. Leave it out and the tag sits at -2.5,
# just off level, which is enough to stop it reading as a tidy caption. Anything beyond -45 to 45 is
# treated as a mistake, falls back to -2.5, and is reported in megamek.log.
#
#splashTagRotation=-2.5
